name: CI - Unit Tests & E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: NUnit Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Backend/UnitTest/UnitTest.csproj

      - name: Build
        run: dotnet build Backend/UnitTest/UnitTest.csproj --no-restore

      - name: Kør NUnit tests
        run: dotnet test Backend/UnitTest/UnitTest.csproj --no-build --verbosity normal

  e2e-tests:
    name: Bruno E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Kør Bruno E2E tests mod deployed API
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          cd "Bruno/PostDanmark API"
          bru run --env ci
