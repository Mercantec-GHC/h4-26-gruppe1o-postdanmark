services:
  backend:
    build:
      context: ./Backend
      dockerfile: API/Dockerfile
    ports:
      - "4010:5000"
    env_file:
      - .env
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - app-network

  frontend:
    build:
      context: ./reactnative
      dockerfile: Dockerfile
    ports:
      - "4011:80"
    depends_on:
      - backend
    networks:
      - app-network

  # Wiki - Fumadocs dokumentation på Next.js
  # Tilgængelig på http://localhost:4012
  wiki:
    build:
      context: ./wiki/postdanmark   # Mappe der indeholder Dockerfile og kildekode
      dockerfile: Dockerfile        # Dockerfile til multi-stage Next.js build
    ports:
      - "4012:3000"                 # Host-port 4012 -> container-port 3000 (Next.js default)
    networks:
      - app-network

networks:
  app-network:
    driver: bridge